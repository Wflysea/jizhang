name: Build & Release APK

# 每次推送到 main 自动构建并把安装包发布到 Release；
# 推送 v* 版本标签时，发布对应版本号的 Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_DIR: xiaowang-jizhang-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build web assets
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Capacitor sync (web -> android)
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Point Gradle to the SDK
        working-directory: ${{ env.APP_DIR }}/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 推送到 main：更新滚动 Release（tag=continuous）
      - name: Remove old rolling release
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --yes || true
          git push origin :refs/tags/continuous || true

      - name: Publish rolling release (push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          prerelease: true
          name: 自动构建 (Continuous)
          body: |
            自动构建于 commit `${{ github.sha }}`
            提交信息：${{ github.event.head_commit.message }}
          files: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk

      # 推送 v* 标签：发布对应版本 Release
      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
